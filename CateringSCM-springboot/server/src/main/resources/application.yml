login-reg:
  jwt:
    admin-secret-key: catering_catering_scm_my_graduation-design
    admin-ttl: 864000000
    admin-token-name: token

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.student.scm.entity

springdoc:
  packages-to-scan: com.student.scm.controller
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    url: v3/api-docs
    disable-swagger-default-url: false
  api-docs:
    enabled: true
    path: /v3/api-docs