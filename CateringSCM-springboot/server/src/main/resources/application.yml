spring:
  application:
    name: server
  profiles:
    active: dev
  datasource:
    driver-class-name: ${scm.datasource.driver-class-name}
    url: ${scm.datasource.url}
    username: ${scm.datasource.username}
    password: ${scm.datasource.password}

#jwt:
#  admin-secret-key: catering_scm_my_graduation-design
